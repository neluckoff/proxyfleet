name: Publish release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxyfleet-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and check release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          control_version="$(sed -nE 's/^const version = "([^"]+)"$/\1/p' internal/control/server.go)"
          agent_version="$(sed -nE 's/^const agentVersion = "([^"]+)"$/\1/p' internal/agent/agent.go)"

          if [[ ! "$control_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Control-plane version is not valid semver: $control_version" >&2
            exit 1
          fi
          if [[ "$agent_version" != "$control_version" ]]; then
            echo "Version mismatch: control=$control_version agent=$agent_version" >&2
            exit 1
          fi

          tag="v$control_version"
          echo "version=$control_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Preparing ProxyFleet $tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test and validate
        run: |
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          node --check internal/control/web/app.js
          node --check internal/control/web/i18n.js
          node --check internal/control/web/service-worker.js

  publish:
    needs: [prepare, verify]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: neluckoff/proxyfleet
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker buildx imagetools inspect "neluckoff/proxyfleet:$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "ProxyFleet $VERSION" \
            --generate-notes \
            --latest

      - name: Write release summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## ProxyFleet $TAG published"
            echo
            echo "- Docker image: \`neluckoff/proxyfleet:$VERSION\`"
            echo "- Image digest: \`$DIGEST\`"
            echo "- GitHub Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
