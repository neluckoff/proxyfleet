name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check embedded JavaScript
        run: |
          node --check internal/control/web/app.js
          node --check internal/control/web/i18n.js

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Build container image
        run: docker build --pull -t proxyfleet:ci .
