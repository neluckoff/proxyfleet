name: proxyfleet

services:
  control:
    container_name: proxyfleet-control
    build:
      context: .
    image: ${PROXYFLEET_IMAGE:-neluckoff/proxyfleet:latest}
    restart: unless-stopped
    command: ["server"]
    volumes:
      - control_data:/data
    ports:
      - "127.0.0.1:8088:8080"

volumes:
  control_data:
    name: proxyfleet-control-data
