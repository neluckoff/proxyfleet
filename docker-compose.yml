name: proxyfleet

services:
  control:
    container_name: proxyfleet-control
    build:
      context: .
    image: proxyfleet:local
    restart: unless-stopped
    command: ["server"]
    volumes:
      - control_data:/data
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  control_data:
    name: proxyfleet-control-data
